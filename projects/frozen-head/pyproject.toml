[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frozen-head"
version = "0.1.0"
description = "A person-centre head on frozen SigLIP 2 features, cached once per image"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Eoin McAllister" }]
dependencies = ["aerial-search", "transformers>=5.18.0"]

[tool.uv.sources]
aerial-search = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/frozen_head"]
