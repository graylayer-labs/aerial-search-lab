[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssl-aerial-person-detection"
version = "0.1.0"
description = "Self-supervised RGB-thermal learning for aerial person detection"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Eoin McAllister" }]
dependencies = [
    "boto3>=1.43.72",
    "gdown>=6.1.0",
    "pillow>=12.3.0",
    "pycocotools>=2.0.11",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.18.0",
]

[project.scripts]
aerial-search = "aerial_search.cli:main"

[dependency-groups]
dev = [
    "moto>=5.2.2",
    "pytest>=8.3",
    "ruff>=0.11",
    "ty>=0.0.1a16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aerial_search"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.12"
