# uv workspace root. It is not a package itself: shared code lives in
# shared/*, and each approach in projects/* is its own package.

[tool.uv.workspace]
members = ["shared/*", "projects/*"]
exclude = ["projects/_template"]

[tool.uv.sources]
aerial-search = { workspace = true }

[dependency-groups]
# Every workspace member is listed here, so `uv sync --dev` installs them all
# without --all-packages (the org CI runs plain `uv sync --dev --locked`).
dev = [
    "aerial-search",
    "moto>=5.2.2",
    "pytest>=8.3",
    "ruff>=0.11",
    "ty>=0.0.1a16",
]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["shared", "projects"]
norecursedirs = ["_template", ".*", "__pycache__"]

[tool.coverage.run]
# The org CI passes --cov=src, which no longer exists at the root; these
# packages are measured as well.
source_pkgs = ["aerial_search"]

[tool.ruff]
line-length = 88
target-version = "py312"
# So workspace packages sort as first-party imports.
src = ["shared/*/src", "projects/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.12"
