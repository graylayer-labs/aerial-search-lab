version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
  # Security updates only (no version-update PRs); sets their title prefix.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
